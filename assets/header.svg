<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Terminal running a Selenium suite for Santiago Martinez, QA Automation Engineer, ending in an Allure report: 184 passed, 2 failed, 1 broken, 5 skipped.">
  <rect width="1000" height="340" rx="14" fill="#0c1016"/>
  <rect x="0.5" y="0.5" width="999" height="339" rx="13.5" fill="none" stroke="#2a3140"/>

  <rect x="1" y="1" width="998" height="46" rx="13" fill="#131921"/>
  <rect x="1" y="34" width="998" height="13" fill="#131921"/>
  <line x1="1" y1="47" x2="999" y2="47" stroke="#2a3140"/>
  <circle cx="28" cy="24" r="5" fill="#3a4252"/>
  <circle cx="46" cy="24" r="5" fill="#3a4252"/>
  <circle cx="64" cy="24" r="5" fill="#3a4252"/>
  <text x="88" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b93a3">santiago@qa: ~/checkout-suite</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="30" y="82"><tspan fill="#8b93a3">santiago@qa:~$</tspan><tspan fill="#e8ebf0" dx="8">pytest tests/ --alluredir=allure-results</tspan></text>

    <text x="34" y="116" fill="#57c98a" font-size="13">✓</text>
    <text x="54" y="116" fill="#8b93a3">find_element(By.ID, "user-name").send_keys(<tspan fill="#e8ebf0">"standard_user"</tspan>)</text>
    <text x="600" y="116" fill="#6c7484" font-size="13">0.41s</text>

    <text x="34" y="142" fill="#57c98a" font-size="13">✓</text>
    <text x="54" y="142" fill="#8b93a3">wait.until(EC.element_to_be_clickable(CART))</text>
    <text x="600" y="142" fill="#6c7484" font-size="13">1.24s</text>

    <text x="34" y="168" fill="#57c98a" font-size="13">✓</text>
    <text x="54" y="168" fill="#8b93a3">assert cart.badge_count == <tspan fill="#e8ebf0">3</tspan></text>
    <text x="600" y="168" fill="#6c7484" font-size="13">0.06s</text>

    <text x="34" y="194" fill="#f2604f" font-size="13">✕</text>
    <text x="54" y="194" fill="#8b93a3">find_element(By.CSS, ".checkout").click</text>
    <text x="600" y="194" fill="#6c7484" font-size="13">5.00s</text>

    <text x="30" y="228"><tspan fill="#8b93a3">santiago@qa:~$</tspan><tspan fill="#e8ebf0" dx="8">allure serve allure-results</tspan></text>
  </g>

  <line x1="30" y1="252" x2="970" y2="252" stroke="#2a3140"/>

  <g transform="translate(84, 300)">
    <circle r="30" fill="none" stroke="#57c98a" stroke-width="8" stroke-dasharray="179.91 8.59" transform="rotate(-90)"/>
    <circle r="30" fill="none" stroke="#f2604f" stroke-width="8" stroke-dasharray="2.60 185.90" transform="rotate(255)"/>
    <circle r="30" fill="none" stroke="#f0a02c" stroke-width="8" stroke-dasharray="2.60 185.90" transform="rotate(258.75)"/>
    <circle r="30" fill="none" stroke="#8f97a6" stroke-width="8" stroke-dasharray="4.18 184.32" transform="rotate(260.62)"/>
    <text text-anchor="middle" y="6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#e8ebf0">96%</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="150" y="282" width="8" height="8" rx="2" fill="#57c98a"/>
    <text x="168" y="290" fill="#8b93a3">Passed</text><text x="248" y="290" fill="#e8ebf0" text-anchor="end">184</text>
    <rect x="150" y="304" width="8" height="8" rx="2" fill="#f0a02c"/>
    <text x="168" y="312" fill="#8b93a3">Broken</text><text x="248" y="312" fill="#e8ebf0" text-anchor="end">1</text>

    <rect x="290" y="282" width="8" height="8" rx="2" fill="#f2604f"/>
    <text x="308" y="290" fill="#8b93a3">Failed</text><text x="380" y="290" fill="#e8ebf0" text-anchor="end">2</text>
    <rect x="290" y="304" width="8" height="8" rx="2" fill="#8f97a6"/>
    <text x="308" y="312" fill="#8b93a3">Skipped</text><text x="380" y="312" fill="#e8ebf0" text-anchor="end">5</text>

    <text x="450" y="290" fill="#6c7484">192 tests · 3m 41s · 1 flaky</text>
    <text x="450" y="312" fill="#00becb">Santiago Martínez — QA Automation Engineer</text>
  </g>
</svg>
