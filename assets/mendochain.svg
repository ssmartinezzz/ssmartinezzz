  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131921"/><stop offset="1" stop-color="#0c1016"/></linearGradient></defs>
  <rect width="400" height="220" rx="14" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="399" height="219" rx="13.5" fill="none" stroke="#2a3140"/>
