<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Animated terminal: a parametrized pytest test is printed, then pytest runs and reports 113 passed.">
  <style>
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
    .p { fill: #8b93a3; } .t { fill: #e8ebf0; } .k { fill: #c792ea; } .f { fill: #82aaff; }
    .s { fill: #c3e88d; } .n { fill: #f78c6c; } .d { fill: #ffcb6b; } .c { fill: #6c7484; }
    .ok { fill: #57c98a; } .dim { fill: #6c7484; }
    .l { opacity: 0; animation: show .01s linear forwards; }
    .cover { animation: type 1.1s steps(38, end) forwards; }
    .bar { animation: type 1.6s steps(60, end) forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes type { to { transform: translateX(760px); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1000" height="470" rx="14" fill="#0c1016"/>
  <rect x=".5" y=".5" width="999" height="469" rx="13.5" fill="none" stroke="#2a3140"/>
  <rect x="1" y="1" width="998" height="46" rx="13" fill="#131921"/>
  <rect x="1" y="34" width="998" height="13" fill="#131921"/>
  <line x1="1" y1="47" x2="999" y2="47" stroke="#2a3140"/>
  <circle cx="28" cy="24" r="5" fill="#f2604f"/>
  <circle cx="46" cy="24" r="5" fill="#f0a02c"/>
  <circle cx="64" cy="24" r="5" fill="#57c98a"/>
  <text x="88" y="29" class="m p" font-size="13">santiago@qa: ~/suite — zsh</text>

  <g class="m">
    <!-- command 1: typed -->
    <text x="30" y="82"><tspan class="p">santiago@qa:~$</tspan><tspan class="t" dx="8">bat tests/test_checkout.py</tspan></text>
    <rect x="150" y="66" width="760" height="22" fill="#0c1016" class="cover" style="animation-delay:.3s"/>

    <g class="l" style="animation-delay:1.6s">
      <text x="30" y="112"><tspan class="k">import</tspan><tspan class="t"> pytest</tspan></text>
      <text x="30" y="134"><tspan class="k">from</tspan><tspan class="t"> pages.checkout </tspan><tspan class="k">import</tspan><tspan class="t"> CheckoutPage</tspan></text>
    </g>
    <g class="l" style="animation-delay:2.0s">
      <text x="30" y="168"><tspan class="d">@pytest.mark.parametrize</tspan><tspan class="t">(</tspan><tspan class="s">"items, total"</tspan><tspan class="t">, [(</tspan><tspan class="n">1</tspan><tspan class="t">, </tspan><tspan class="n">29.99</tspan><tspan class="t">), (</tspan><tspan class="n">3</tspan><tspan class="t">, </tspan><tspan class="n">79.97</tspan><tspan class="t">)])</tspan></text>
    </g>
    <g class="l" style="animation-delay:2.4s">
      <text x="30" y="190"><tspan class="k">def</tspan><tspan class="f"> test_cart_total_matches</tspan><tspan class="t">(driver, items, total):</tspan></text>
    </g>
    <g class="l" style="animation-delay:2.8s">
      <text x="64" y="212"><tspan class="t">page = CheckoutPage(driver).add_items(items)</tspan></text>
    </g>
    <g class="l" style="animation-delay:3.2s">
      <text x="64" y="234"><tspan class="k">assert</tspan><tspan class="t"> page.total() == pytest.approx(total)</tspan></text>
    </g>

    <!-- command 2: typed -->
    <g class="l" style="animation-delay:3.8s">
      <text x="30" y="276"><tspan class="p">santiago@qa:~$</tspan><tspan class="t" dx="8">pytest -n auto --alluredir=allure-results</tspan></text>
      <rect x="150" y="260" width="760" height="22" fill="#0c1016" class="cover" style="animation-delay:3.9s"/>
    </g>

    <g class="l" style="animation-delay:5.2s">
      <text x="30" y="306" class="dim">platform linux -- Python 3.12, pytest-8.3, xdist-3.6</text>
      <text x="30" y="328" class="dim">collected 113 items</text>
    </g>
    <g class="l" style="animation-delay:5.6s">
      <text x="30" y="358" class="ok">.................................................................</text>
      <text x="30" y="380" class="ok">................................................</text>
      <text x="530" y="380" class="dim">[100%]</text>
      <rect x="28" y="342" width="760" height="44" fill="#0c1016" class="bar" style="animation-delay:5.6s"/>
    </g>
    <g class="l" style="animation-delay:7.4s">
      <rect x="30" y="398" width="940" height="1" fill="#2a3140"/>
      <text x="30" y="428"><tspan class="ok" font-weight="700">113 passed</tspan><tspan class="dim"> in 4.82s  ·  report → allure serve allure-results</tspan></text>
    </g>
    <g class="l" style="animation-delay:7.6s">
      <text x="30" y="456"><tspan class="p">santiago@qa:~$</tspan></text>
      <rect x="152" y="443" width="9" height="17" fill="#e8ebf0" class="cursor"/>
    </g>
  </g>
</svg>
